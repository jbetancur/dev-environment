# Applied by cluster.sh via envsubst after cert-manager CRDs are ready.
# Variables: ACME_EMAIL, ACME_DOMAIN, ACME_WILDCARD, ACME_BASE
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-cloudflare-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - ${ACME_DOMAIN}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dev-tls
  namespace: envoy-gateway-system
spec:
  secretName: dev-tls
  commonName: "${ACME_WILDCARD}"
  dnsNames:
    - "${ACME_WILDCARD}"
    - "${ACME_BASE}"
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
