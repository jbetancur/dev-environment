# ClusterIssuer and Certificate for Let's Encrypt via Cloudflare DNS-01.
# Placeholder values here are replaced by Kustomize from cluster-values.yaml,
# which cluster.sh patches with real values before pushing to git.
# CLOUDFLARE_TOKEN comes from the cloudflare-api-token Secret (created by cluster.sh).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: placeholder@example.com
    privateKeySecretRef:
      name: letsencrypt-cloudflare-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - example.com
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dev-tls
  namespace: envoy-gateway-system
spec:
  secretName: dev-tls
  commonName: "*.dev.example.com"
  dnsNames:
    - "*.dev.example.com"
    - "dev.example.com"
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
