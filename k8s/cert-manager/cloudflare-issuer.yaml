# Cloudflare DNS-01 ACME issuer — templated by scripts/cluster.sh via envsubst.
# Do NOT apply this file directly; variables like $ACME_EMAIL won't be substituted.
#
# Variables (set in user.conf):
#   ACME_EMAIL       — Let's Encrypt registration email
#   ACME_DOMAIN      — root domain (e.g. example.com)
#   ACME_SUBDOMAIN   — dev subdomain prefix (e.g. dev)
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-cloudflare-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - ${ACME_DOMAIN}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dev-tls
  namespace: envoy-gateway-system
spec:
  secretName: dev-tls
  commonName: "*.${ACME_SUBDOMAIN}.${ACME_DOMAIN}"
  dnsNames:
    - "*.${ACME_SUBDOMAIN}.${ACME_DOMAIN}"
    - "${ACME_SUBDOMAIN}.${ACME_DOMAIN}"
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
