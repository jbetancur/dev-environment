# Self-signed ClusterIssuer — bootstraps a local CA for kind dev clusters.
# Applied by cluster.sh when --with-certs is passed.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# Local CA cert — issued by the self-signed issuer above.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: local-ca
  secretName: local-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# ClusterIssuer backed by the local CA — use this in Certificate resources.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca
spec:
  ca:
    secretName: local-ca-secret
---
# TLS cert for localhost — referenced by the Gateway HTTPS listener.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-tls
  namespace: envoy-gateway-system
spec:
  secretName: local-tls
  commonName: localhost
  dnsNames:
    - localhost
  issuerRef:
    name: local-ca
    kind: ClusterIssuer
    group: cert-manager.io
