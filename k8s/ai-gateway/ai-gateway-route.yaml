# GatewayConfig — tells the AI gateway controller to inject the extproc sidecar
# into the Envoy pod for the Gateway annotated with this config.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: GatewayConfig
metadata:
  name: ai-gateway-config
  namespace: ai-gateway
spec: {}
---
# ClientTrafficPolicy — raises Envoy's default 32KiB buffer to 50MiB for LLM responses
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: ai-buffer-limit
  namespace: ai-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: local
      namespace: envoy-gateway-system
  connection:
    bufferLimit: 50Mi
---
# AIServiceBackend — wraps the Envoy Gateway Backend with OpenAI schema awareness
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: openai
  namespace: ai-gateway
spec:
  schema:
    name: OpenAI
  backendRef:
    name: openai
    kind: Backend
    group: gateway.envoyproxy.io
---
# BackendSecurityPolicy — injects the OpenAI API key from the secret created by Pulumi
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: openai-apikey
  namespace: ai-gateway
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: openai
  type: APIKey
  apiKey:
    secretRef:
      name: openai-apikey
      namespace: ai-gateway
---
# AIGatewayRoute — routes model-tagged requests to the OpenAI backend
# Clients set the x-ai-eg-model header to select the model.
# The route attaches to the shared Gateway via the HTTPRoute in Pulumi (gateway.ts).
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: openai
  namespace: ai-gateway
spec:
  parentRefs:
    - name: local
      namespace: envoy-gateway-system
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-4o-mini
      backendRefs:
        - name: openai
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-4o
      backendRefs:
        - name: openai
  # Track token usage in metadata for the BackendTrafficPolicy rate limiter
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_token
      type: TotalToken
