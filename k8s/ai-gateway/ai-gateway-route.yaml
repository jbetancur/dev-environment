# AIServiceBackend — wraps the Envoy Gateway Backend with OpenAI schema awareness
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: openai
  namespace: ai-gateway
spec:
  schema:
    name: OpenAI
  backendRef:
    name: openai
    kind: Backend
    group: gateway.envoyproxy.io
---
# BackendSecurityPolicy — injects the OpenAI API key from the secret created by Pulumi
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: openai-apikey
  namespace: ai-gateway
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: openai
  type: APIKey
  apiKey:
    secretRef:
      name: openai-apikey
      namespace: ai-gateway
---
# AIGatewayRoute — routes model-tagged requests to the OpenAI backend
# Clients set the x-ai-eg-model header to select the model.
# The route attaches to the shared Gateway via the HTTPRoute in Pulumi (gateway.ts).
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: openai
  namespace: ai-gateway
  annotations:
    reconcile-trigger: "1"
spec:
  parentRefs:
    - name: local
      namespace: envoy-gateway-system
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-4o-mini
      backendRefs:
        - name: openai
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-4o
      backendRefs:
        - name: openai
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-5.5
      backendRefs:
        - name: openai
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-5.4
      backendRefs:
        - name: openai
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-5.4-mini
      backendRefs:
        - name: openai
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: gpt-image-1
      backendRefs:
        - name: openai
