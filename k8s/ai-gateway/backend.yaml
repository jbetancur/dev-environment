# Envoy Gateway Backend resource pointing at api.openai.com
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: openai
  namespace: ai-gateway
spec:
  endpoints:
    - fqdn:
        hostname: api.openai.com
        port: 443
---
# TLS validation for the OpenAI backend using system CA bundle
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: openai-tls
  namespace: ai-gateway
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: openai
  validation:
    wellKnownCACertificates: System
    hostname: api.openai.com
