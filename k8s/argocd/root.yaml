# Root app-of-apps — manages all child Application CRs in k8s/argocd/apps/.
# Applied once by cluster.sh after ArgoCD is installed.
# From that point on, adding a file to k8s/argocd/apps/ and pushing to git
# is all that's needed to deploy a new component.
#
# Templated by cluster.sh via envsubst.
# Variables: ARGOCD_REPO_URL
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
  finalizers: []
spec:
  project: default
  source:
    repoURL: ${ARGOCD_REPO_URL}
    targetRevision: HEAD
    path: k8s/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
