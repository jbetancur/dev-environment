# Templated by scripts/cluster.sh via envsubst — do not apply directly.
# Variables: ACME_SUBDOMAIN, ACME_DOMAIN
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: local
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "argocd.${ACME_SUBDOMAIN}.${ACME_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
