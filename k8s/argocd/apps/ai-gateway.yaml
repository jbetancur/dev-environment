# AI Gateway config — AIGatewayRoute, AIServiceBackend, BackendSecurityPolicy, rate limiting.
# The controller and OpenAI secret are installed by Pulumi (src/ai-gateway.ts).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jbetancur/dev-environment.git
    targetRevision: HEAD
    path: k8s/ai-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
