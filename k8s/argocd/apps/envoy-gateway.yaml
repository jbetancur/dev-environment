---
# Envoy Gateway controller — installed via Helm
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  finalizers: []
spec:
  project: default
  source:
    repoURL: https://charts.envoyproxy.io
    chart: gateway-helm
    targetRevision: v1.7.2
    helm:
      skipCrds: true
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Envoy Gateway config — GatewayClass, EnvoyProxy, Gateway, HTTPRoutes
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-config
  namespace: argocd
  finalizers: []
spec:
  project: default
  source:
    repoURL: https://github.com/jbetancur/dev-environment.git
    targetRevision: HEAD
    path: k8s/envoy-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
