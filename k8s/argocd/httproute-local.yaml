# Applied by scripts/cluster.sh when --with-gateway is used without --with-acme.
# HTTP only, argocd.localhost.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: local
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "argocd.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
