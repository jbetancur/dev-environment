# ArgoCD Application that watches k8s/apps/ in this repo.
# Any manifest dropped into k8s/apps/ is automatically synced to the cluster.
#
# Templated by scripts/cluster.sh via envsubst — do not apply directly.
# Variables: ARGOCD_REPO_URL
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
  # Deleting this Application will not delete the resources it manages
  finalizers: []
spec:
  project: default
  source:
    repoURL: ${ARGOCD_REPO_URL}
    targetRevision: HEAD
    path: k8s/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
