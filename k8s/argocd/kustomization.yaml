apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - httproute.yaml
replacements:
  - source:
      kind: ConfigMap
      name: cluster-values
      fieldPath: data.ACME_BASE
    targets:
      - select:
          kind: HTTPRoute
          name: argocd
        fieldPaths:
          - spec.hostnames.0
        options:
          create: true
