# Applied by scripts/cluster.sh when --with-gateway is used without --with-acme.
# HTTP only, hubble.localhost.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: local
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "hubble.localhost"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hubble-ui
          port: 80
