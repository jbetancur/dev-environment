---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-ui
  template:
    metadata:
      labels:
        app: registry-ui
    spec:
      containers:
        - name: registry-ui
          image: joxit/docker-registry-ui:main
          env:
            - name: SINGLE_REGISTRY
              value: "true"
            - name: REGISTRY_URL
              value: "http://kind-registry:5000"
            - name: DELETE_IMAGES
              value: "true"
            - name: SHOW_CONTENT_DIGEST
              value: "true"
            - name: NGINX_PROXY_PASS_URL
              value: "http://kind-registry:5000"
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: registry-ui
  namespace: default
spec:
  selector:
    app: registry-ui
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: registry-ui
  namespace: default
spec:
  parentRefs:
    - name: local
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "registry.k8s.example.com"  # replace with your subdomain.domain
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: registry-ui
          port: 80
