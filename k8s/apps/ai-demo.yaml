---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-demo
  namespace: ai-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-demo
  template:
    metadata:
      labels:
        app: ai-demo
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-05-24"
    spec:
      containers:
        - name: ai-demo
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: html
          configMap:
            name: ai-demo-html
        - name: nginx-conf
          configMap:
            name: ai-demo-nginx-conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-demo-html
  namespace: ai-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <title>Envoy AI Gateway Demo</title>
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 1rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 0.75rem; }
        header h1 { font-size: 1.1rem; font-weight: 600; }
        header span { font-size: 0.75rem; color: #64748b; }
        #chat { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .msg { max-width: 70%; padding: 0.75rem 1rem; border-radius: 0.75rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .msg.user { align-self: flex-end; background: #3b82f6; color: #fff; }
        .msg.assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
        .msg.error { align-self: flex-start; background: #7f1d1d; border: 1px solid #991b1b; color: #fca5a5; }
        #form { display: flex; gap: 0.5rem; padding: 1rem 1.5rem; background: #1e293b; border-top: 1px solid #334155; }
        #input { flex: 1; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 0.5rem; padding: 0.6rem 0.875rem; font-size: 0.95rem; outline: none; }
        #input:focus { border-color: #3b82f6; }
        #model { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 0.5rem; padding: 0.6rem 0.5rem; font-size: 0.85rem; }
        button { background: #3b82f6; color: #fff; border: none; border-radius: 0.5rem; padding: 0.6rem 1.25rem; cursor: pointer; font-size: 0.95rem; }
        button:disabled { opacity: 0.5; cursor: default; }
      </style>
    </head>
    <body>
      <header>
        <h1>Envoy AI Gateway</h1>
        <span>routed via ai.DOMAIN → OpenAI</span>
      </header>
      <div id="chat"></div>
      <form id="form">
        <select id="model">
          <option value="gpt-4o-mini">gpt-4o-mini</option>
          <option value="gpt-4o">gpt-4o</option>
        </select>
        <input id="input" type="text" placeholder="Ask something…" autocomplete="off" />
        <button type="submit" id="send">Send</button>
      </form>
      <script>
        const chat = document.getElementById('chat');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const modelSel = document.getElementById('model');
        const sendBtn = document.getElementById('send');
        const history = [];

        // Proxy path — nginx forwards /v1/ to the AI gateway, avoiding CORS
        const GATEWAY = '';

        function addMsg(role, text) {
          const el = document.createElement('div');
          el.className = 'msg ' + role;
          el.textContent = text;
          chat.appendChild(el);
          chat.scrollTop = chat.scrollHeight;
          return el;
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const text = input.value.trim();
          if (!text) return;
          const model = modelSel.value;
          input.value = '';
          sendBtn.disabled = true;

          addMsg('user', text);
          history.push({ role: 'user', content: text });

          const thinking = addMsg('assistant', '…');

          try {
            const res = await fetch(GATEWAY + '/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-ai-eg-model': model,
                'x-tenant-id': 'demo',
              },
              body: JSON.stringify({ model, messages: history, stream: false }),
            });

            if (!res.ok) {
              const err = await res.text();
              thinking.className = 'msg error';
              thinking.textContent = 'Error ' + res.status + ': ' + err;
              history.pop();
              return;
            }

            const data = await res.json();
            const reply = data.choices?.[0]?.message?.content ?? '(empty response)';
            thinking.textContent = reply;
            history.push({ role: 'assistant', content: reply });
          } catch (err) {
            thinking.className = 'msg error';
            thinking.textContent = 'Network error: ' + err.message;
            history.pop();
          } finally {
            sendBtn.disabled = false;
            input.focus();
          }
        });
      </script>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-demo-nginx-conf
  namespace: ai-demo
data:
  default.conf: |
    server {
      listen 80;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location /v1/ {
        proxy_pass https://envoy-envoy-gateway-system-local-c3ff217f.envoy-gateway-system.svc.cluster.local:443/v1/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name ai.k8s.thebetancurs.net;
        proxy_set_header Host ai.k8s.thebetancurs.net;
        proxy_pass_request_headers on;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-demo
  namespace: ai-demo
spec:
  selector:
    app: ai-demo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-demo
  namespace: ai-demo
spec:
  parentRefs:
    - name: local
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "ai-demo.k8s.thebetancurs.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ai-demo
          port: 80
