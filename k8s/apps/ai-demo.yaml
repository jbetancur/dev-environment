---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-demo
  namespace: ai-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-demo
  template:
    metadata:
      labels:
        app: ai-demo
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-05-24"
        configmap.reloader.stakater.com/reload: "ai-demo-html,ai-demo-nginx-conf"
    spec:
      containers:
        - name: ai-demo
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: html
          configMap:
            name: ai-demo-html
        - name: nginx-conf
          configMap:
            name: ai-demo-nginx-conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-demo-html
  namespace: ai-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <title>Envoy AI Gateway Demo</title>
      <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 1rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 0.75rem; }
        header h1 { font-size: 1.1rem; font-weight: 600; }
        header span { font-size: 0.75rem; color: #64748b; }
        #chat { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .msg { max-width: 70%; padding: 0.75rem 1rem; border-radius: 0.75rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .msg.user { align-self: flex-end; background: #3b82f6; color: #fff; }
        .msg.assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
        .msg.error { align-self: flex-start; background: #7f1d1d; border: 1px solid #991b1b; color: #fca5a5; }
        .msg img { max-width: 100%; border-radius: 0.5rem; display: block; }
        .msg.assistant { white-space: normal; }
        .msg.assistant p { margin: 0 0 0.5em; }
        .msg.assistant p:last-child { margin-bottom: 0; }
        .msg.assistant pre { background: #0f172a; border: 1px solid #334155; border-radius: 0.4rem; padding: 0.75rem; overflow-x: auto; margin: 0.5em 0; }
        .msg.assistant code { font-family: ui-monospace, monospace; font-size: 0.85em; }
        .msg.assistant pre code { background: none; padding: 0; }
        .msg.assistant :not(pre) > code { background: #0f172a; padding: 0.15em 0.35em; border-radius: 0.25rem; }
        .msg.assistant ul, .msg.assistant ol { padding-left: 1.25em; margin: 0.4em 0; }
        .msg.assistant li { margin: 0.2em 0; }
        .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 { margin: 0.6em 0 0.3em; font-weight: 600; }
        .msg.assistant a { color: #60a5fa; }
        #form { display: flex; gap: 0.5rem; padding: 1rem 1.5rem; background: #1e293b; border-top: 1px solid #334155; align-items: center; flex-wrap: wrap; }
        #input { flex: 1; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 0.5rem; padding: 0.6rem 0.875rem; font-size: 0.95rem; outline: none; min-width: 0; }
        #input:focus { border-color: #3b82f6; }
        #model { background: #0f172a; border: 1px solid #334155; color: #e2e8f0; border-radius: 0.5rem; padding: 0.6rem 0.5rem; font-size: 0.85rem; }
        #attach-label { display: none; align-items: center; gap: 0.35rem; background: #0f172a; border: 1px solid #334155; color: #94a3b8; border-radius: 0.5rem; padding: 0.6rem 0.75rem; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
        #attach-label.visible { display: flex; }
        #attach-label.has-file { border-color: #3b82f6; color: #93c5fd; }
        #attach { display: none; }
        button { background: #3b82f6; color: #fff; border: none; border-radius: 0.5rem; padding: 0.6rem 1.25rem; cursor: pointer; font-size: 0.95rem; }
        button:disabled { opacity: 0.5; cursor: default; }
        #clear { background: transparent; border: 1px solid #334155; color: #64748b; padding: 0.6rem 0.75rem; font-size: 0.85rem; }
        #clear:hover { border-color: #475569; color: #94a3b8; }
        #sprite-preset { background: transparent; border: 1px solid #334155; color: #a78bfa; padding: 0.6rem 0.75rem; font-size: 0.85rem; }
        #sprite-preset:hover { border-color: #7c3aed; color: #c4b5fd; }
      </style>
    </head>
    <body>
      <header>
        <h1>Envoy AI Gateway</h1>
        <span>routed via ai.DOMAIN → OpenAI</span>
        <button id="sprite-preset" type="button">🎮 Sprite</button>
        <button id="clear" type="button" style="margin-left:auto">Clear</button>
      </header>
      <div id="chat"></div>
      <form id="form">
        <select id="model">
          <optgroup label="Chat">
            <option value="gpt-5.5">gpt-5.5</option>
            <option value="gpt-5.4">gpt-5.4</option>
            <option value="gpt-5.4-mini">gpt-5.4-mini</option>
            <option value="gpt-4o-mini">gpt-4o-mini</option>
            <option value="gpt-4o">gpt-4o</option>
          </optgroup>
          <optgroup label="Image Generation">
            <option value="gpt-image-1">gpt-image-1</option>
            <option value="dall-e-3">dall-e-3</option>
            <option value="dall-e-2">dall-e-2</option>
          </optgroup>
        </select>
        <label id="attach-label" for="attach">📎 <span id="attach-name">Attach image</span></label>
        <input id="attach" type="file" accept="image/*" />
        <input id="input" type="text" placeholder="Ask something…" autocomplete="off" />
        <button type="submit" id="send">Send</button>
      </form>
      <script>
        const chat = document.getElementById('chat');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const modelSel = document.getElementById('model');
        const sendBtn = document.getElementById('send');
        const clearBtn = document.getElementById('clear');
        const spriteBtn = document.getElementById('sprite-preset');
        const attachLabel = document.getElementById('attach-label');
        const attachInput = document.getElementById('attach');
        const attachName = document.getElementById('attach-name');
        const history = [];

        marked.setOptions({ breaks: true });

        const DALLE_MODELS = new Set(['gpt-image-1', 'dall-e-3', 'dall-e-2']);
        const VISION_MODELS = new Set(['gpt-4o', 'gpt-4o-mini', 'gpt-5.5', 'gpt-5.4', 'gpt-5.4-mini']);

        function isImageGen(m) { return DALLE_MODELS.has(m); }
        function isVision(m) { return VISION_MODELS.has(m); }

        function updateUI() {
          const m = modelSel.value;
          input.placeholder = isImageGen(m) ? 'Describe an image…' : 'Ask something…';
          attachLabel.classList.toggle('visible', isVision(m));
          if (!isVision(m)) { attachInput.value = ''; attachName.textContent = 'Attach image'; attachLabel.classList.remove('has-file'); }
        }

        modelSel.addEventListener('change', updateUI);

        attachInput.addEventListener('change', () => {
          const f = attachInput.files[0];
          if (f) { attachName.textContent = f.name; attachLabel.classList.add('has-file'); }
          else { attachName.textContent = 'Attach image'; attachLabel.classList.remove('has-file'); }
        });

        clearBtn.addEventListener('click', () => {
          history.length = 0;
          chat.innerHTML = '';
        });

        const SPRITE_TEMPLATES = [
          'pixel art game sprite sheet, 4 walk cycle frames, 32x32 per frame, transparent background, top-down RPG style: ',
          'pixel art game sprite, 16x16, transparent background, retro 8-bit style: ',
          'pixel art character sprite sheet, idle + run + jump animations, 48x48 per frame, transparent background: ',
          'isometric pixel art game sprite, 64x64, transparent background, RPG item: ',
        ];
        let spriteTemplateIdx = 0;

        spriteBtn.addEventListener('click', () => {
          modelSel.value = 'gpt-image-1';
          updateUI();
          input.value = SPRITE_TEMPLATES[spriteTemplateIdx % SPRITE_TEMPLATES.length];
          spriteTemplateIdx++;
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        });

        function addMsg(role, text) {
          const el = document.createElement('div');
          el.className = 'msg ' + role;
          el.textContent = text;
          chat.appendChild(el);
          chat.scrollTop = chat.scrollHeight;
          return el;
        }

        function addMarkdownMsg(role) {
          const el = document.createElement('div');
          el.className = 'msg ' + role;
          chat.appendChild(el);
          chat.scrollTop = chat.scrollHeight;
          return {
            el,
            append(chunk) {
              this._raw = (this._raw || '') + chunk;
              el.innerHTML = marked.parse(this._raw);
              chat.scrollTop = chat.scrollHeight;
            },
          };
        }

        function addImgMsg(src) {
          const el = document.createElement('div');
          el.className = 'msg assistant';
          const img = document.createElement('img');
          img.src = src;
          el.appendChild(img);
          chat.appendChild(el);
          chat.scrollTop = chat.scrollHeight;
        }

        async function fileToDataUrl(file) {
          return new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.onerror = rej;
            r.readAsDataURL(file);
          });
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const text = input.value.trim();
          if (!text) return;
          const model = modelSel.value;
          input.value = '';
          sendBtn.disabled = true;

          if (isImageGen(model)) {
            addMsg('user', text);
            const thinking = addMsg('assistant', '…');
            try {
              const isGptImage = model === 'gpt-image-1';
              const body = { model, prompt: text, n: 1, size: '1024x1024' };
              if (!isGptImage) body.response_format = 'url';
              const res = await fetch('/v1/images/generations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-ai-eg-model': model, 'x-tenant-id': 'demo' },
                body: JSON.stringify(body),
              });
              if (!res.ok) {
                const err = await res.text();
                thinking.className = 'msg error';
                thinking.textContent = 'Error ' + res.status + ': ' + err;
                return;
              }
              const data = await res.json();
              const item = data.data?.[0];
              const url = item?.url ?? (item?.b64_json ? 'data:image/png;base64,' + item.b64_json : null);
              thinking.remove();
              if (url) addImgMsg(url);
              else addMsg('assistant', '(no image returned)');
            } catch (err) {
              thinking.className = 'msg error';
              thinking.textContent = 'Network error: ' + err.message;
            } finally {
              sendBtn.disabled = false;
              input.focus();
            }
            return;
          }

          // Chat / vision with streaming
          const file = attachInput.files[0];
          let userContent;
          if (file && isVision(model)) {
            const dataUrl = await fileToDataUrl(file);
            userContent = [
              { type: 'image_url', image_url: { url: dataUrl } },
              { type: 'text', text },
            ];
            attachInput.value = '';
            attachName.textContent = 'Attach image';
            attachLabel.classList.remove('has-file');
          } else {
            userContent = text;
          }

          addMsg('user', text);
          history.push({ role: 'user', content: userContent });
          const msg = addMarkdownMsg('assistant');
          msg.append('…');

          try {
            const res = await fetch('/v1/chat/completions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-ai-eg-model': model, 'x-tenant-id': 'demo' },
              body: JSON.stringify({ model, messages: history, stream: true }),
            });
            if (!res.ok) {
              const err = await res.text();
              msg.el.className = 'msg error';
              msg.el.textContent = 'Error ' + res.status + ': ' + err;
              history.pop();
              return;
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let reply = '';
            let buf = '';
            msg._raw = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += decoder.decode(value, { stream: true });
              const lines = buf.split('\n');
              buf = lines.pop();
              for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const data = line.slice(6).trim();
                if (data === '[DONE]') break;
                try {
                  const chunk = JSON.parse(data);
                  const delta = chunk.choices?.[0]?.delta?.content;
                  if (delta) { reply += delta; msg.append(delta); }
                } catch {}
              }
            }

            history.push({ role: 'assistant', content: reply });
          } catch (err) {
            msg.el.className = 'msg error';
            msg.el.textContent = 'Network error: ' + err.message;
            history.pop();
          } finally {
            sendBtn.disabled = false;
            input.focus();
          }
        });
      </script>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-demo-nginx-conf
  namespace: ai-demo
data:
  default.conf: |
    server {
      listen 80;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location /v1/ {
        proxy_pass https://envoy-envoy-gateway-system-local-c3ff217f.envoy-gateway-system.svc.cluster.local:443/v1/;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name ai.k8s.thebetancurs.net;
        proxy_set_header Host ai.k8s.thebetancurs.net;
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-demo
  namespace: ai-demo
spec:
  selector:
    app: ai-demo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-demo
  namespace: ai-demo
spec:
  parentRefs:
    - name: local
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "ai-demo.k8s.thebetancurs.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ai-demo
          port: 80
