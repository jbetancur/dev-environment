# EnvoyProxy configuration for kind clusters.
#
# Schedules Envoy proxy pods onto the control-plane node (the only node with
# extraPortMappings in cluster.yaml) and exposes hostPorts 80/443 so that
# localhost traffic reaches the Gateway without needing a LoadBalancer.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind-hostport
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  tolerations:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
                      effect: NoSchedule
                  nodeSelector:
                    node-role.kubernetes.io/control-plane: ""
                  containers:
                    - name: envoy
                      ports:
                        - containerPort: 80
                          hostPort: 80
                          protocol: TCP
                        - containerPort: 443
                          hostPort: 443
                          protocol: TCP
