# Templated by scripts/cluster.sh via envsubst — do not apply directly.
# Variables: ACME_SUBDOMAIN, ACME_DOMAIN
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: local
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${ACME_SUBDOMAIN}.${ACME_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: dev-tls
            namespace: envoy-gateway-system
